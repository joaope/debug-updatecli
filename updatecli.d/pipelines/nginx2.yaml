name: nginx-ingress-update

scms:
  default:
    kind: github
    spec:
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      username: "{{ .github.username }}"
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      branch: "{{ .github.branch }}"

sources:
  ingress:
    kind: helmchart
    spec:
      url: "https://kubernetes.github.io/ingress-nginx"
      name: "ingress-nginx"

targets:
  publicIngress:
    name: "ingress-nginx"
    kind: helmchart
    sourceid: ingress
    scmid: default
    spec:
      name: "charts/ingress-nginx2"
      file: "Chart.yaml"
      key: "$.dependencies[0].version"

actions:
  nodesAmis:
    kind: github/pullrequest
    title: Update nginx `{{ source "ingress" }}`
    scmid: default
    spec:
      draft: true
      labels:
      - eks
      - dependencies