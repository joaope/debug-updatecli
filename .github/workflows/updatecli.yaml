name: updatecli

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  updatecli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run updatecli
        uses: updatecli/updatecli-action@v2
        with:
          version: "v0.110.1"
      
      - run: updatecli apply --values updatecli.d/values.yaml --config updatecli.d/pipelines/nginx.yaml
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_DEBUG: "api"